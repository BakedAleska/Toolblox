name: Pages

# Installed apps refuse to open once the signed update manifest expires (seven days), so this
# re-signs it twice a day and whenever a release is published.
on:
  schedule:
    - cron: "17 */12 * * *"
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-updates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
          CATALOGUE_PRIVATE_KEY: ${{ secrets.CATALOGUE_PRIVATE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub disables scheduled workflows after 60 days without repository activity, which
      # would let the manifest expire. Re-enabling through the API resets that timer.
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
