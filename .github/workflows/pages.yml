name: Pages

# The only workflow that deploys GitHub Pages. It publishes the download page, the signed update
# manifest and widget catalogue, and the API docs from the docs branch under /docs/.
#
# Installed apps refuse to open once the manifest expires (seven days), so it's re-signed daily.
# Releases and docs builds call this workflow instead of deploying themselves, runs are queued
# one at a time, and every run leaves exactly one deployment behind.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  deployments: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: docs
          path: api-docs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-updates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_PRIVATE_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
          CATALOGUE_PRIVATE_KEY: ${{ secrets.CATALOGUE_PRIVATE_KEY }}
      - name: Add the API docs
        run: |
          rm -rf api-docs/.git
          mv api-docs _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub creates this job's deployment when the job starts, links its statuses to the run,
      # and marks it successful only when the job ends. This step runs only after the deploy
      # succeeded, so that deployment is the one serving the site; every other one is deleted.
      # Nothing is deleted if it isn't found.
      - name: Remove older deployments
        run: |
          api="repos/$GITHUB_REPOSITORY/deployments"
          current=""
          for id in $(gh api "$api?environment=github-pages&per_page=20" --jq '.[].id'); do
            if [[ "$(gh api "$api/$id/statuses?per_page=1" --jq '.[0].log_url // ""')" == *"/actions/runs/$GITHUB_RUN_ID/"* ]]; then
              current=$id
              break
            fi
          done
          if [ -z "$current" ]; then
            echo "::warning::This run's deployment wasn't found, so no deployments were removed."
            exit 0
          fi
          for id in $(gh api --paginate "$api?environment=github-pages&per_page=100" --jq '.[].id'); do
            [ "$id" = "$current" ] && continue
            gh api -X POST "$api/$id/statuses" -f state=inactive > /dev/null
            gh api -X DELETE "$api/$id" > /dev/null
          done
          echo "Kept deployment $current."
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub disables scheduled workflows after 60 days without repository activity, which
      # would let the manifest expire. Re-enabling through the API resets that timer.
      - name: Keep the schedule enabled
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
