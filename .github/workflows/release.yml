name: Build and publish a release

# Triggered by pushing a version tag (e.g. `v0.1.0-beta`), which must match
# toolblox.version.APP_VERSION with a leading "v" - see that module's
# docstring. Every build here is the packaged "beta" release channel (see
# toolblox.devtools.release_channel); there's no separate packaged build
# for "canary".
#
# workflow_dispatch exists for rebuilding/testing the build steps by hand;
# the installer and release jobs are guarded to only run for a real tag
# push, since they construct a GitHub release download URL from the ref
# and publish to GitHub Releases, neither of which makes sense off a
# branch. A workflow_dispatch run off a tag ref (re-running a past
# release) still works.
#
# All builds are unsigned for now: Windows SmartScreen and macOS Gatekeeper
# will both warn on first run. Signing/notarization (EV cert vs. documented
# "Run anyway" instructions) is a deliberately deferred decision.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read APP_VERSION
        id: version
        run: |
          echo "app-version=$(python -c 'from toolblox.version import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build package
        run: python release/build.py

      - name: Checksum build zip
        shell: bash
        run: |
          set -eu
          for zip in dist/Toolblox-*-windows.zip; do
            sha256sum "$zip" | cut -d' ' -f1 > "${zip}.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/Toolblox-*-windows.zip
            dist/Toolblox-*-windows.zip.sha256
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build package
        run: python release/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/Toolblox-*-macos.zip
          if-no-files-found: error

  installer:
    needs: [version, build-windows]
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Build native launcher (Toolblox.exe)
        shell: pwsh
        run: .\native\launcher\build.ps1

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Compile installer
        shell: bash
        env:
          # Git Bash's MSYS layer mangles any argument starting with "/<letter>"
          # as a POSIX path (e.g. "/DMyAppVersion=..." looks like a drive-letter
          # path to it), which corrupts makensis's /D switches before it ever
          # sees them. This disables that path conversion for this step only.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -eu
          VERSION="${{ needs.version.outputs.app-version }}"
          ZIP_NAME="Toolblox-${VERSION}-windows.zip"
          SHA256=$(sha256sum "dist/${ZIP_NAME}" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          # VIProductVersion needs a strict "X.X.X.X" numeric string - strip
          # any "-beta"/"-canary" suffix and pad to four parts.
          NUMERIC="${VERSION%%-*}"
          IFS='.' read -r -a PARTS <<< "$NUMERIC"
          while [ "${#PARTS[@]}" -lt 4 ]; do
            PARTS+=("0")
          done
          VERSION_NUMERIC="$(IFS=.; echo "${PARTS[*]:0:4}")"
          "/c/Program Files (x86)/NSIS/makensis.exe" \
            "/DMyAppVersion=${VERSION}" \
            "/DMyAppVersionNumeric=${VERSION_NUMERIC}" \
            "/DDownloadURL=${URL}" \
            "/DDownloadSHA256=${SHA256}" \
            installer/Toolblox.nsi

      - name: Checksum installer
        shell: bash
        run: |
          set -eu
          for exe in installer/Output/ToolbloxSetup-*.exe; do
            sha256sum "$exe" | cut -d' ' -f1 > "${exe}.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-installer
          path: |
            installer/Output/ToolbloxSetup-*.exe
            installer/Output/ToolbloxSetup-*.exe.sha256
          if-no-files-found: error

  release:
    needs: [version, build-macos, installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Toolblox ${{ needs.version.outputs.app-version }}"
          draft: true
          files: dist/*
          body: |
            Windows: download and run ToolbloxSetup-*.exe. Don't
            download the Toolblox-*-windows.zip directly - it's a
            build artifact the installer and the in-app updater use
            internally, not meant to be extracted and run by hand.

            macOS: download Toolblox-*-macos.zip and unzip it.

            Unsigned build. Windows will show a SmartScreen warning
            ("More info" -> "Run anyway"); macOS needs a right-click ->
            Open the first time, since Gatekeeper blocks an unsigned
            app from opening normally.
